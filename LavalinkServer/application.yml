server: # REST and WS server
  port: ${LAVALINK_PORT:2333}
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 8500 # ปรับกลับเป็น 8.5 วิ เพื่อให้เพลงเริ่มเล่นเร็วขึ้น
    frameBufferDurationMs: 5000 # ปรับกลับเป็น 5 วิ
    opusEncodingQuality: 5 # เพิ่มคุณภาพเสียง
    resamplingQuality: MEDIUM # ปรับให้เสียงเนียนขึ้น
    trackStuckThresholdMs: 15000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 3
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
